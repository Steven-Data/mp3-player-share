<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>MP3 分享播放頁</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700;900&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f1e7;
        --surface: #fffdf8;
        --surface-2: #efe7d8;
        --ink: #2b2118;
        --ink-soft: #6f6053;
        --line: #ddd2bf;
        --accent: #b4501e;
        --accent-strong: #96400f;
        --accent-soft: #f3ddcb;
        --playing-bg: #f7e8d7;
        --shadow: 0 10px 30px rgba(84, 54, 20, 0.12);
        --lyric-dim: #a08d76;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #171310;
          --surface: #221c17;
          --surface-2: #2b231c;
          --ink: #f0e6d8;
          --ink-soft: #b3a28c;
          --line: #3d332a;
          --accent: #e07f3f;
          --accent-strong: #f09552;
          --accent-soft: #4a3220;
          --playing-bg: #33261a;
          --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
          --lyric-dim: #7d6c58;
        }
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .wrap {
        max-width: 1120px;
        margin: 0 auto;
        padding: 28px 20px 56px;
      }
      header.page-head { margin-bottom: 22px; }
      header.page-head h1 {
        font-family: "Noto Serif TC", serif;
        font-weight: 900;
        font-size: clamp(26px, 4vw, 36px);
        margin: 0 0 6px;
        letter-spacing: 0.02em;
      }
      header.page-head p {
        margin: 0;
        color: var(--ink-soft);
        font-size: 15px;
      }
      .layout {
        display: grid;
        grid-template-columns: minmax(0, 5fr) minmax(0, 6fr);
        gap: 22px;
        align-items: start;
      }
      .player-card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 18px;
        box-shadow: var(--shadow);
        padding: 26px 24px 22px;
        position: sticky;
        top: 20px;
      }
      .now-label {
        font-size: 12px;
        letter-spacing: 0.18em;
        color: var(--ink-soft);
        margin: 0 0 8px;
      }
      .now-title {
        font-family: "Noto Serif TC", serif;
        font-weight: 700;
        font-size: clamp(26px, 3.4vw, 34px);
        line-height: 1.25;
        margin: 0 0 4px;
        min-height: 1.25em;
      }
      .now-sub { color: var(--ink-soft); font-size: 14px; margin: 0 0 20px; }
      .seek-row { display: flex; align-items: center; gap: 10px; font-variant-numeric: tabular-nums; font-size: 13px; color: var(--ink-soft); }
      input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        height: 6px;
        border-radius: 999px;
        background: var(--surface-2);
        outline: none;
        cursor: pointer;
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 16px; height: 16px;
        border-radius: 50%;
        background: var(--accent);
        border: 2px solid var(--surface);
        box-shadow: 0 1px 4px rgba(0,0,0,0.25);
      }
      input[type="range"]::-moz-range-thumb {
        width: 14px; height: 14px; border-radius: 50%;
        background: var(--accent); border: 2px solid var(--surface);
      }
      #seek { flex: 1; }
      .controls {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
        margin: 18px 0 6px;
      }
      .btn {
        border: 1px solid var(--line);
        background: var(--surface-2);
        color: var(--ink);
        border-radius: 999px;
        height: 46px; min-width: 46px;
        padding: 0 14px;
        font-size: 15px;
        display: inline-flex; align-items: center; justify-content: center; gap: 6px;
        cursor: pointer;
        font-family: inherit;
      }
      .btn:hover { border-color: var(--accent); color: var(--accent-strong); }
      .btn:focus-visible, .track:focus-visible, .lyric-line:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      .btn.main {
        width: 64px; height: 64px; min-width: 64px;
        background: var(--accent); border-color: var(--accent); color: #fff8f0;
        font-size: 24px;
      }
      .btn.main:hover { background: var(--accent-strong); color: #fff; }
      .btn.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-strong); font-weight: 700; }
      .sub-controls {
        display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center;
        margin-top: 12px;
      }
      .sub-controls .vol { display: inline-flex; align-items: center; gap: 8px; color: var(--ink-soft); font-size: 13px; }
      #volume { width: 92px; }
      .lyrics-box {
        margin-top: 22px;
        border-top: 1px solid var(--line);
        padding-top: 16px;
      }
      .lyrics-head {
        display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px;
      }
      .lyrics-head h2 { font-size: 15px; margin: 0; font-weight: 700; }
      .lyrics-head span { font-size: 12px; color: var(--ink-soft); }
      .lyrics {
        position: relative;
        height: 264px;
        overflow-y: auto;
        padding: 88px 4px;
        scroll-behavior: smooth;
        mask-image: linear-gradient(to bottom, transparent, #000 18%, #000 82%, transparent);
        -webkit-mask-image: linear-gradient(to bottom, transparent, #000 18%, #000 82%, transparent);
      }
      @media (prefers-reduced-motion: reduce) {
        .lyrics { scroll-behavior: auto; }
      }
      .lyric-line {
        text-align: center;
        font-size: 16px;
        line-height: 1.5;
        padding: 5px 8px;
        color: var(--lyric-dim);
        cursor: pointer;
        border-radius: 8px;
        transition: color 0.25s, font-size 0.25s;
      }
      .lyric-line:hover { color: var(--ink); }
      .lyric-line.current {
        color: var(--accent-strong);
        font-weight: 700;
        font-size: 18px;
        font-family: "Noto Serif TC", serif;
      }
      .lyric-none { text-align: center; color: var(--ink-soft); padding: 30px 0; }
      .playlist-card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 18px;
        box-shadow: var(--shadow);
        overflow: hidden;
      }
      .playlist-head {
        padding: 18px 22px 12px;
        display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
      }
      .playlist-head h2 { font-size: 17px; margin: 0; font-weight: 700; }
      .playlist-head span { font-size: 13px; color: var(--ink-soft); white-space: nowrap; }
      ol.playlist { list-style: none; margin: 0; padding: 6px 10px 12px; }
      .track {
        display: flex; align-items: center; gap: 12px;
        width: 100%;
        padding: 11px 12px;
        border: none; background: transparent;
        border-radius: 12px;
        cursor: pointer;
        text-align: left;
        font-family: inherit;
        color: var(--ink);
      }
      .track:hover { background: var(--surface-2); }
      .track.playing { background: var(--playing-bg); }
      .track .num {
        width: 26px; text-align: center; flex: none;
        color: var(--ink-soft); font-size: 13px; font-variant-numeric: tabular-nums;
      }
      .track .t-title { flex: 1; font-size: 16px; font-weight: 500; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .track.playing .t-title { color: var(--accent-strong); font-weight: 700; }
      .track .t-dur { color: var(--ink-soft); font-size: 13px; font-variant-numeric: tabular-nums; flex: none; }
      ol.playlist li { display: flex; align-items: center; gap: 2px; }
      .track { flex: 1; min-width: 0; }
      .loop-toggle {
        flex: none; width: 38px; height: 38px; margin-right: 4px;
        border-radius: 50%; border: 1px solid var(--line);
        background: transparent; color: var(--ink-soft);
        font-size: 17px; line-height: 1; cursor: pointer; font-family: inherit;
        display: inline-flex; align-items: center; justify-content: center;
      }
      .loop-toggle:hover { border-color: var(--accent); color: var(--accent-strong); }
      .loop-toggle.on { background: var(--accent); border-color: var(--accent); color: #fff8f0; }
      .loop-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      .track.in-loop { box-shadow: inset 3px 0 0 var(--accent); background: var(--accent-soft); }
      .track.in-loop.playing { background: var(--playing-bg); }
      .loop-bar {
        display: flex; align-items: center; justify-content: space-between; gap: 10px;
        padding: 0 22px 10px; font-size: 13px; color: var(--ink-soft); flex-wrap: wrap;
      }
      .loop-actions { display: inline-flex; gap: 6px; flex: none; }
      .mini-btn {
        border: 1px solid var(--line); background: var(--surface-2); color: var(--ink);
        border-radius: 999px; padding: 4px 12px; font-size: 13px; cursor: pointer; font-family: inherit;
      }
      .mini-btn:hover { border-color: var(--accent); color: var(--accent-strong); }
      .eq { display: none; align-items: flex-end; gap: 2px; height: 14px; flex: none; }
      .track.playing .eq { display: inline-flex; }
      .track.playing .num { display: none; }
      .eq i { width: 3px; background: var(--accent); border-radius: 2px; animation: eq 0.9s ease-in-out infinite; }
      .eq i:nth-child(1) { height: 60%; animation-delay: 0s; }
      .eq i:nth-child(2) { height: 100%; animation-delay: 0.25s; }
      .eq i:nth-child(3) { height: 45%; animation-delay: 0.5s; }
      .eq.paused i { animation-play-state: paused; }
      @keyframes eq { 0%, 100% { transform: scaleY(0.5); } 50% { transform: scaleY(1); } }
      @media (prefers-reduced-motion: reduce) { .eq i { animation: none; } }
      @media (max-width: 820px) {
        .layout { grid-template-columns: 1fr; }
        .player-card { position: static; }
        .lyrics { height: 220px; padding: 66px 4px; }
        .wrap { padding: 20px 14px 44px; }
      }
    </style>

    <div class="wrap">
      <header class="page-head">
        <h1>歌單</h1>
        <p>14 首歌曲 · 點第一首開始，就會一首接一首連續播放到最後</p>
      </header>

      <div class="layout">
        <section class="player-card" aria-label="播放器">
          <p class="now-label">正在播放</p>
          <h2 class="now-title" id="nowTitle">同花順</h2>
          <p class="now-sub" id="nowSub">第 1 首 / 共 14 首</p>

          <div class="seek-row">
            <span id="curTime">0:00</span>
            <input type="range" id="seek" min="0" max="1000" value="0" aria-label="播放進度" />
            <span id="totTime">0:00</span>
          </div>

          <div class="controls">
            <button class="btn" id="prevBtn" aria-label="上一首" title="上一首">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 5h2v14H6zM20 5v14L9.5 12z"/></svg>
            </button>
            <button class="btn main" id="playBtn" aria-label="播放" title="播放 / 暫停">
              <svg id="playIcon" width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>
              <svg id="pauseIcon" width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="display:none"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
            </button>
            <button class="btn" id="nextBtn" aria-label="下一首" title="下一首">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16 5h2v14h-2zM4 5v14l10.5-7z"/></svg>
            </button>
          </div>

          <div class="sub-controls">
            <button class="btn active" id="modeBtn" title="播放模式">循環全部</button>
            <button class="btn" id="speedBtn" title="播放速度">1× 速度</button>
            <span class="vol">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
              <input type="range" id="volume" min="0" max="100" value="90" aria-label="音量" />
            </span>
          </div>

          <div class="lyrics-box">
            <div class="lyrics-head">
              <h2>歌詞</h2>
              <span>點任一句可跳到該段</span>
            </div>
            <div class="lyrics" id="lyrics" aria-label="動態歌詞"></div>
          </div>
        </section>

        <section class="playlist-card" aria-label="播放清單">
          <div class="playlist-head">
            <h2>播放清單</h2>
            <span id="totalTime"></span>
          </div>
          <div class="loop-bar">
            <span id="loopInfo"></span>
            <span class="loop-actions">
              <button class="mini-btn" id="loopAllBtn" type="button">全選</button>
              <button class="mini-btn" id="loopClearBtn" type="button">清除</button>
            </span>
          </div>
          <ol class="playlist" id="playlist"></ol>
        </section>
      </div>
    </div>

          loopInfo.textContent = n === 0
            ? '點歌右邊的 ↻，挑你想循環聽的歌（沒選時，自選循環＝全部循環）'
            : '自選循環已選 ' + n + ' 首' + (mode === 'selected' ? ' · 播放中' : ' · 把播放模式切到「自選循環」就會只播這幾首');
        }
        document.getElementById('loopAllBtn').addEventListener('click', function () {
          TRACKS.forEach(function (_, j) { loopSet.add(j); });
          saveLoopSet();
          updateLoopUI();
        });
        document.getElementById('loopClearBtn').addEventListener('click', function () {
          loopSet.clear();
          saveLoopSet();
          updateLoopUI();
        });

        // ---- Lyrics ----
        function renderLyrics(track) {
          lyricsEl.innerHTML = '';
          lyricEls = [];
          currentLyricIdx = -1;
          if (!track.lyrics || !track.lyrics.length) {
            var none = document.createElement('div');
            none.className = 'lyric-none';
            none.textContent = '這首歌暫時沒有歌詞';
            lyricsEl.appendChild(none);
            return;
          }
          track.lyrics.forEach(function (line, idx) {
            var div = document.createElement('div');
            div.className = 'lyric-line';
            div.textContent = line.s;
            div.setAttribute('role', 'button');
            div.setAttribute('tabindex', '0');
            div.addEventListener('click', function () {
              audio.currentTime = line.t + 0.01;
              if (audio.paused) audio.play();
            });
            div.addEventListener('keydown', function (e) {
              if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); div.click(); }
            });
            lyricsEl.appendChild(div);
            lyricEls.push(div);
          });
          lyricsEl.scrollTop = 0;
        }

        function updateLyrics() {
          var track = TRACKS[current];
          if (!track.lyrics || !track.lyrics.length) return;
          var t = audio.currentTime;
          var idx = -1;
          for (var i = 0; i < track.lyrics.length; i++) {
            if (track.lyrics[i].t <= t) idx = i; else break;
          }
          if (idx === currentLyricIdx) return;
          if (currentLyricIdx >= 0 && lyricEls[currentLyricIdx]) {
            lyricEls[currentLyricIdx].classList.remove('current');
          }
          currentLyricIdx = idx;
          if (idx >= 0 && lyricEls[idx]) {
            lyricEls[idx].classList.add('current');
            var target = lyricEls[idx].offsetTop - lyricsEl.clientHeight / 2 + lyricEls[idx].clientHeight / 2;
            lyricsEl.scrollTo({ top: target, behavior: 'smooth' });
          }
        }

        // ---- Playback ----
        function loadTrack(i, autoplay) {
          current = (i + TRACKS.length) % TRACKS.length;
          var track = TRACKS[current];
          audio.src = track.src;
          audio.playbackRate = speeds[speedIdx];
          nowTitle.textContent = track.title;
          nowSub.textContent = '第 ' + (current + 1) + ' 首 / 共 ' + TRACKS.length + ' 首';
          totTimeEl.textContent = fmt(track.dur);
          curTimeEl.textContent = '0:00';
          seek.value = 0;
          renderLyrics(track);
          trackEls.forEach(function (el, j) { el.classList.toggle('playing', j === current); });
          if ('mediaSession' in navigator) {
            navigator.mediaSession.metadata = new MediaMetadata({ title: track.title, artist: '歌單', album: '分享歌單' });
          }
          document.title = track.title + ' · MP3 分享播放頁';
          if (autoplay) {
            var p = audio.play();
            if (p && p.catch) p.catch(function () {});
          }
        }

        function setPlayUI(playing) {
          playIcon.style.display = playing ? 'none' : '';
          pauseIcon.style.display = playing ? '' : 'none';
          playBtn.setAttribute('aria-label', playing ? '暫停' : '播放');
          var eq = trackEls[current] && trackEls[current].querySelector('.eq');
          if (eq) eq.classList.toggle('paused', !playing);
        }

        playBtn.addEventListener('click', function () {
          if (audio.paused) { audio.play(); } else { audio.pause(); }
        });
        function stepInSelection(dir) {
          var list = selectedList();
          if (!list.length) return null;
          var pos = list.indexOf(current);
          if (pos === -1) return dir > 0 ? list[0] : list[list.length - 1];
          return list[(pos + dir + list.length) % list.length];
        }
        function nextIndex() {
          if (mode === 'selected') {
            var n = stepInSelection(1);
            if (n !== null) return n;
          }
          return current + 1;
        }
        function prevIndex() {
          if (mode === 'selected') {
            var p = stepInSelection(-1);
            if (p !== null) return p;
          }
          return current - 1;
        }
        prevBtn.addEventListener('click', function () {
          if (audio.currentTime > 4) { audio.currentTime = 0; return; }
          loadTrack(prevIndex(), true);
        });
        nextBtn.addEventListener('click', function () { loadTrack(nextIndex(), true); });

        modeBtn.addEventListener('click', function () {
          if (mode === 'all') { mode = 'selected'; modeBtn.textContent = '自選循環'; }
          else if (mode === 'selected') { mode = 'one'; modeBtn.textContent = '單曲循環'; }
          else if (mode === 'one') { mode = 'shuffle'; modeBtn.textContent = '隨機播放'; }
          else { mode = 'all'; modeBtn.textContent = '循環全部'; }
          updateLoopUI();
        });
        speedBtn.addEventListener('click', function () {
          speedIdx = (speedIdx + 1) % speeds.length;
          audio.playbackRate = speeds[speedIdx];
          speedBtn.textContent = speeds[speedIdx] + '× 速度';
          speedBtn.classList.toggle('active', speeds[speedIdx] !== 1);
        });

        seek.addEventListener('input', function () { seeking = true; });
        seek.addEventListener('change', function () {
          if (isFinite(audio.duration) && audio.duration > 0) {
            audio.currentTime = (seek.value / 1000) * audio.duration;
          }
          seeking = false;
        });
        volumeEl.addEventListener('input', function () { audio.volume = volumeEl.value / 100; });

        audio.addEventListener('play', function () { setPlayUI(true); });
        audio.addEventListener('pause', function () { setPlayUI(false); });
        audio.addEventListener('loadedmetadata', function () {
          if (isFinite(audio.duration)) totTimeEl.textContent = fmt(audio.duration);
        });
        audio.addEventListener('timeupdate', function () {
          curTimeEl.textContent = fmt(audio.currentTime);
          if (!seeking && isFinite(audio.duration) && audio.duration > 0) {
            seek.value = Math.round((audio.currentTime / audio.duration) * 1000);
          }
          updateLyrics();
        });
        audio.addEventListener('ended', function () {
          if (mode === 'one') {
            audio.currentTime = 0;
            audio.play();
          } else if (mode === 'shuffle') {
            var n = current;
            if (TRACKS.length > 1) {
              while (n === current) n = Math.floor(Math.random() * TRACKS.length);
            }
            loadTrack(n, true);
          } else {
            loadTrack(nextIndex(), true);
          }
        });

        document.addEventListener('keydown', function (e) {
          if (e.code === 'Space' && !/INPUT|BUTTON/.test(document.activeElement.tagName)) {
            e.preventDefault();
            if (audio.paused) audio.play(); else audio.pause();
          }
        });

        if ('mediaSession' in navigator) {
          navigator.mediaSession.setActionHandler('previoustrack', function () { loadTrack(prevIndex(), true); });
          navigator.mediaSession.setActionHandler('nexttrack', function () { loadTrack(nextIndex(), true); });
        }

        audio.volume = 0.9;
        updateLoopUI();
        loadTrack(0, false);
      })();
    </script>
  </body>
</html>
